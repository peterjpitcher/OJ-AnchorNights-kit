name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Lint (zero warnings)
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Tests (Europe/London)
        run: npm test
      - name: Tests (UTC)
        run: npm run test:utc
